<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlantGuide — Identify & Care</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="header">
      <div class="header-inner">
        <div class="logo">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
            <circle cx="14" cy="14" r="13" fill="#22c55e" opacity=".15"/>
            <path d="M14 6C10 6 7 10 7 14s3 8 7 8 7-4 7-8-3-8-7-8z" fill="#22c55e" opacity=".6"/>
            <path d="M14 9c-2.5 0-4.5 2-4.5 5s2 5 4.5 5 4.5-2 4.5-5-2-5-4.5-5z" fill="#22c55e"/>
            <path d="M14 11c-1 0-2 .8-2 2.5s1 2.5 2 2.5 2-.8 2-2.5-1-2.5-2-2.5z" fill="#fff"/>
          </svg>
          <span>PlantGuide</span>
        </div>
        <div class="header-stats">
          <span id="visible-count">160</span> species
        </div>
      </div>
    </header>

    <!-- Main Layout -->
    <div class="layout">
      <!-- Sidebar: Tag Picker -->
      <aside class="sidebar" id="tag-sidebar">
        <div class="sidebar-header">
          <h2>Filter by Tags</h2>
          <button class="btn-clear" id="clear-tags" title="Clear all filters">Clear</button>
        </div>
        <div class="tag-sections" id="tag-sections">
          <!-- Generated by JS -->
        </div>
      </aside>

      <!-- Main: Species Grid -->
      <main class="main">
        <!-- Active Filters -->
        <div class="active-filters" id="active-filters" style="display:none">
          <span class="filter-label">Active filters:</span>
          <div class="filter-chips" id="filter-chips"></div>
        </div>

        <!-- Search -->
        <div class="search-bar">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
            <circle cx="7" cy="7" r="5" stroke="#94a3b8" stroke-width="1.5"/>
            <path d="M11 11l3 3" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <input type="text" id="search-input" placeholder="Search by name or scientific name..." autocomplete="off">
        </div>

        <!-- Species Grid -->
        <div class="species-grid" id="species-grid">
          <!-- Generated by JS -->
        </div>

        <!-- Empty State -->
        <div class="empty-state" id="empty-state" style="display:none">
          <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
            <circle cx="24" cy="24" r="22" fill="#f1f5f9"/>
            <path d="M24 12c-5 0-9 4-9 9s4 9 9 9 9-4 9-9-4-9-9-9z" fill="#cbd5e1" opacity=".5"/>
            <path d="M24 16c-3 0-5 2-5 5s2 5 5 5 5-2 5-5-2-5-5-5z" fill="#94a3b8"/>
          </svg>
          <p>No plants match your filters</p>
          <button class="btn-clear-all" id="clear-all-filters">Clear all filters</button>
        </div>
      </main>
    </div>

    <!-- Care Card Modal -->
    <div class="modal-overlay" id="care-modal" style="display:none">
      <div class="modal" id="care-modal-content">
        <button class="modal-close" id="modal-close" aria-label="Close">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <path d="M15 5L5 15M5 5l10 10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
        <div class="modal-body" id="modal-body">
          <!-- Generated by JS -->
        </div>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
